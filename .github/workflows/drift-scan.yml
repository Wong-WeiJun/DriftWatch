name: Drift Scan

on:
  schedule:
    # Run every 6 hours (at minute 0 of 0,6,12,18 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run as dry-run (no persistence, returns results immediately)'
        required: false
        default: true
        type: boolean
      resource_types:
        description: 'Comma-separated list of resource types to scan (empty = all)'
        required: false
        default: ''
        type: string

jobs:
  scan:
    name: Trigger Drift Scan
    runs-on: ubuntu-latest
    steps:
      - name: Trigger drift scan via API
        env:
          API_URL: ${{ vars.API_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESOURCE_TYPES: ${{ inputs.resource_types }}
        run: |
          # Build resource_types list for JSON
          if [ -n "$RESOURCE_TYPES" ]; then
            # Convert comma-separated to JSON array
            TYPES_JSON=$(echo "$RESOURCE_TYPES" | tr ',' '\n' | jq -R . | jq -s .)
            PAYLOAD=$(printf '{"dry_run":%s,"resource_types":%s}' "$DRY_RUN" "$TYPES_JSON")
          else
            PAYLOAD=$(printf '{"dry_run":%s}' "$DRY_RUN")
          fi

          echo "Triggering drift scan at: ${API_URL}/api/v1/scan/trigger"
          echo "Payload: ${PAYLOAD}"

          RESPONSE=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API_URL}/api/v1/scan/trigger")

          echo "Response:"
          echo "$RESPONSE" | jq .

          # Extract scan_id for follow-up
          SCAN_ID=$(echo "$RESPONSE" | jq -r '.scan_id')
          echo "scan_id=${SCAN_ID}" >> $GITHUB_ENV

          # Verify we got a 200 and proper response structure
          if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
            echo "ERROR: Scan trigger did not return a valid scan_id"
            exit 1
          fi

      - name: Wait for background scan (non-dry-run)
        if: ${{ inputs.dry_run == false || github.event_name == 'schedule' }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "Waiting for scan to complete..."
          sleep 30

          for i in $(seq 1 10); do
            RESULT=$(curl -sf "${API_URL}/api/v1/drifts/scans/${SCAN_ID}")
            STATUS=$(echo "$RESULT" | jq -r '.status')
            echo "Attempt $i: status = $STATUS"
            if [ "$STATUS" != "queued" ]; then
              echo "SCAN COMPLETE!"
              echo "$RESULT" | jq .
              break
            fi
            sleep 10
          done

          # Fetch drift events for this scan
          EVENTS=$(curl -sf "${API_URL}/api/v1/drifts/events?scan_id=${SCAN_ID}&limit=100")
          echo "Drift events for scan ${SCAN_ID}:"
          echo "$EVENTS" | jq .

      - name: Report results
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "=== Drift Scan Complete ==="
          echo "API URL: ${API_URL}"
          echo "Scan ID: ${SCAN_ID}"

          # Get summary
          SUMMARY=$(curl -sf "${API_URL}/api/v1/drifts/scans/${SCAN_ID}")
          echo "$SUMMARY" | jq .
