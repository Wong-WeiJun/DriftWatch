name: Drift Scan

on:
  schedule:
    # Run every 6 hours (at minute 0 of 0,6,12,18 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run as dry-run (no persistence, returns results immediately)'
        required: false
        default: true
        type: boolean
      resource_types:
        description: 'Comma-separated list of resource types to scan (empty = all)'
        required: false
        default: ''
        type: string

env:
  # Schedule always runs non-dry-run (real scan). Manual triggers default to dry-run.
  IS_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == false && 'false' || 'true') }}

jobs:
  scan:
    name: Trigger Drift Scan
    runs-on: ubuntu-latest
    steps:
      - name: Trigger drift scan via API
        env:
          API_URL: ${{ vars.API_URL }}
          DRY_RUN: ${{ env.IS_DRY_RUN }}
          RESOURCE_TYPES: ${{ inputs.resource_types || '' }}
        run: |
          echo "is_dry_run=${DRY_RUN}" >> $GITHUB_ENV

          # Build resource_types list for JSON
          if [ -n "$RESOURCE_TYPES" ]; then
            TYPES_JSON=$(echo "$RESOURCE_TYPES" | tr ',' '\n' | jq -R . | jq -s .)
            PAYLOAD=$(printf '{"dry_run":%s,"resource_types":%s}' "$DRY_RUN" "$TYPES_JSON")
          else
            PAYLOAD=$(printf '{"dry_run":%s}' "$DRY_RUN")
          fi

          echo "Triggering drift scan at: ${API_URL}/scan/trigger"
          echo "Payload: ${PAYLOAD}"

          RESPONSE=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API_URL}/scan/trigger")

          echo "Response:"
          echo "$RESPONSE" | jq .

          # Extract scan_id for follow-up
          SCAN_ID=$(echo "$RESPONSE" | jq -r '.scan_id')
          echo "SCAN_ID=${SCAN_ID}" >> $GITHUB_ENV

          # Verify we got a 200 and proper response structure
          if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
            echo "ERROR: Scan trigger did not return a valid scan_id"
            exit 1
          fi

      - name: Wait for background scan to complete
        if: env.is_dry_run == 'false'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "Waiting for background scan to complete..."
          sleep 30

          for i in $(seq 1 10); do
            RESULT=$(curl -sf "${API_URL}/drifts/scans/${SCAN_ID}")
            STATUS=$(echo "$RESULT" | jq -r '.status')
            echo "Attempt $i: status = $STATUS"
            if [ "$STATUS" != "queued" ]; then
              echo "SCAN COMPLETE!"
              echo "$RESULT" | jq .
              break
            fi
            sleep 10
          done

          # Fetch drift events for this scan
          EVENTS=$(curl -sf "${API_URL}/drifts/events?scan_id=${SCAN_ID}&limit=100")
          echo "Drift events for scan ${SCAN_ID}:"
          echo "$EVENTS" | jq .

      - name: Report results
        if: always()
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "=== Drift Scan Complete ==="
          echo "API URL: ${API_URL}"
          echo "Dry run:   ${{ env.is_dry_run }}"
          echo "Scan ID:   ${SCAN_ID}"

          if [ -n "$SCAN_ID" ] && [ "$SCAN_ID" != "null" ]; then
            SUMMARY=$(curl -sf "${API_URL}/drifts/scans/${SCAN_ID}")
            echo "Summary:"
            echo "$SUMMARY" | jq .
          else
            echo "No scan_id available"
          fi
