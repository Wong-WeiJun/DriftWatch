# =============================================================================
# DriftWatch — Docker Compose (local development)
# =============================================================================
#
# Services:
#   - app          : FastAPI backend (port 8000)
#   - localstack   : Local AWS mock (DynamoDB, S3, SNS)
#   - dynamodb-init: One-shot container that creates the DynamoDB table
#
# Usage:
#   docker compose up --build
#
#   API          → http://localhost:8000
#   Health       → http://localhost:8000/health
#   Scan API     → POST http://localhost:8000/api/v1/scan/trigger
#   Drift Events → GET  http://localhost:8000/api/v1/drifts/events
#
#   LocalStack   → http://localhost:4566
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # LocalStack — mocks DynamoDB, S3 and SNS so the app works without real AWS
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,s3,sns
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # DynamoDB table init — runs once, creates the driftwatch table in localstack
  # ---------------------------------------------------------------------------
  dynamodb-init:
    build: .
    command: >
      python -c "import time; time.sleep(2); from app.core.database import init_db; init_db(); print('DynamoDB table ready')"
    environment:
      AWS_REGION: ap-southeast-2
      DYNAMODB_TABLE_NAME: driftwatch
      DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # DriftWatch FastAPI app
  # ---------------------------------------------------------------------------
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DriftWatch
      ENV: development
      DEBUG: "true"
      AWS_REGION: ap-southeast-2
      DYNAMODB_TABLE_NAME: driftwatch
      DYNAMODB_ENDPOINT_URL: http://localstack:4566
      TF_STATE_BUCKET: driftwatch-local-state
      SNS_TOPIC_ARN: ""
      SCAN_INTERVAL_HOURS: "3"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Hot-reload: changes in ./backend/ are reflected immediately
      - ./backend:/app:ro
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  localstack-data:
