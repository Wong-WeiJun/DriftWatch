# =============================================================================
# DriftWatch — Docker Compose (local development)
# =============================================================================
#
# Services:
#   - localstack   : Local AWS mock (DynamoDB, S3, SNS, EC2, IAM)
#   - dynamodb-init: One-shot — creates the DriftWatch DynamoDB table
#   - s3-init      : One-shot — creates S3 bucket, seeds tfstate + mock resources
#   - app          : FastAPI backend (port 8000)
#   - prometheus   : Scrapes app /metrics (port 9090)
#   - grafana      : Dashboards over Prometheus (port 3000, admin/admin)
#
# Usage:
#   docker compose up --build
#
#   API docs     → http://localhost:8000/docs
#   Health       → http://localhost:8000/health
#   Metrics      → http://localhost:8000/metrics
#   Scan         → POST http://localhost:8000/api/v1/scan/trigger
#   Drift events → GET  http://localhost:8000/api/v1/drifts/events
#   LocalStack   → http://localhost:4566
#   Prometheus   → http://localhost:9090  (Alerts tab shows rule state)
#   Grafana      → http://localhost:3000  (admin / admin)
# =============================================================================

services:

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,s3,sns,ec2,iam
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  dynamodb-init:
    build: .
    command: >-
      python -c "from app.core.database import init_db; init_db()"
    environment:
      PYTHONPATH: /app
      AWS_REGION: ap-southeast-2
      DYNAMODB_TABLE_NAME: driftwatch
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy

  s3-init:
    build: .
    command: python /app/scripts/seed_localstack.py
    environment:
      PYTHONPATH: /app
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      APP_NAME: DriftWatch
      ENV: development
      DEBUG: "true"
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_NAME: driftwatch
      TF_STATE_BUCKET: driftwatch-local-state
      TF_STATE_KEY: terraform.tfstate
      SNS_TOPIC_ARN: ""
      SCAN_INTERVAL_HOURS: "3"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Hot-reload mounts backend/ over /app — models and scripts included
      - ./backend/app:/app/app:ro
      - ./backend/models:/app/models:ro
      - ./backend/scripts:/app/scripts:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  localstack-data:
  prometheus-data:
  grafana-data:
