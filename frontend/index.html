<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driftwatch</title>
  <script src="/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: #8b949e; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.2rem;
    }

    .stat-card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card .value.red  { color: #f85149; }
    .stat-card .value.yellow { color: #d29922; }
    .stat-card .value.green { color: #3fb950; }
    .stat-card .value.blue  { color: #58a6ff; }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button.secondary:hover { background: #30363d; }

    select {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.45rem 0.8rem;
      font-size: 0.85rem;
    }

    .table-wrap {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

    th {
      background: #1c2128;
      color: #8b949e;
      font-weight: 500;
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #30363d;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #21262d;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.high   { background: #3d1515; color: #f85149; border: 1px solid #6e1a1a; }
    .badge.medium { background: #2d2007; color: #d29922; border: 1px solid #5a3e0a; }
    .badge.low    { background: #0d2119; color: #3fb950; border: 1px solid #1a4228; }

    .mono { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #8b949e; }

    .diff-cell { display: flex; flex-direction: column; gap: 0.2rem; }
    .diff-expected { color: #3fb950; font-size: 0.78rem; }
    .diff-actual   { color: #f85149; font-size: 0.78rem; }

    #status-bar {
      font-size: 0.8rem;
      color: #8b949e;
      margin-left: auto;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #8b949e;
    }

    .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #e6edf3; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Driftwatch</h1>
  <span>Cloud Config Drift Monitor</span>
</header>

<main>
  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Drifts</div>
      <div class="value red" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="label">High Severity</div>
      <div class="value red" id="stat-high">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Medium</div>
      <div class="value yellow" id="stat-medium">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Last Scan</div>
      <div class="value blue" id="stat-last-scan" style="font-size:1rem;line-height:2">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Resources Scanned</div>
      <div class="value green" id="stat-resources">—</div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-scan">▶ Run Scan Now</button>
    <button class="secondary" id="btn-refresh">↻ Refresh</button>
    <select id="filter-type">
      <option value="">All resource types</option>
      <option value="ec2">EC2</option>
      <option value="s3">S3</option>
      <option value="security_group">Security Group</option>
      <option value="iam_role">IAM Role</option>
      <option value="rds">RDS</option>
    </select>
    <select id="filter-severity">
      <option value="">All severities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <span id="status-bar">Loading...</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Severity</th>
          <th>Resource</th>
          <th>Type</th>
          <th>Attribute</th>
          <th>Expected → Actual</th>
          <th>Detected</th>
        </tr>
      </thead>
      <tbody id="drift-table-body">
        <tr><td colspan="6"><div class="empty-state"><h3>Loading drift events...</h3></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  // Point this at your ALB DNS or localhost for local dev
  const API_BASE = window.DRIFTWATCH_API_URL || 'http://localhost:8000';

  let allDrifts = [];

  // ── Fetch & render ──────────────────────────────────────────────────────────

  async function fetchDrifts() {
    setStatus('Fetching drift events...');
    try {
      const [driftsRes, scansRes] = await Promise.all([
        fetch(`${API_BASE}/api/v1/drifts/events?limit=200`),
        fetch(`${API_BASE}/api/v1/drifts/scans?limit=1`),
      ]);

      allDrifts = await driftsRes.json();
      const scans = await scansRes.json();

      updateStats(allDrifts, scans[0]);
      renderTable(allDrifts);
      setStatus(`Updated ${new Date().toLocaleTimeString()}`);
    } catch (err) {
      setStatus(`Error: ${err.message}`);
      renderEmpty('Could not reach API. Is the backend running?');
    }
  }

  function updateStats(drifts, lastScan) {
    document.getElementById('stat-total').textContent  = drifts.length;
    document.getElementById('stat-high').textContent   = drifts.filter(d => d.severity === 'high').length;
    document.getElementById('stat-medium').textContent = drifts.filter(d => d.severity === 'medium').length;
    document.getElementById('stat-resources').textContent = lastScan?.resource_scanned ?? '—';
    document.getElementById('stat-last-scan').textContent = lastScan
      ? new Date(lastScan.detected_at).toLocaleString()
      : '—';
  }

  function renderTable(drifts) {
    const typeFilter     = document.getElementById('filter-type').value;
    const severityFilter = document.getElementById('filter-severity').value;

    const filtered = drifts.filter(d =>
      (!typeFilter     || d.resource_type === typeFilter) &&
      (!severityFilter || d.severity === severityFilter)
    );

    const tbody = document.getElementById('drift-table-body');

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">
        <h3>${drifts.length === 0 ? '✅ No drift detected' : 'No results for current filters'}</h3>
        <p>${drifts.length === 0 ? 'Your infrastructure matches Terraform state.' : 'Try clearing the filters.'}</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(d => `
      <tr>
        <td><span class="badge ${d.severity}">${d.severity}</span></td>
        <td class="mono">${escHtml(d.resource_id)}</td>
        <td><span class="badge low">${escHtml(d.resource_type)}</span></td>
        <td class="mono">${escHtml(d.attribute)}</td>
        <td>
          <div class="diff-cell">
            <span class="diff-expected">+ ${escHtml(d.expected)}</span>
            <span class="diff-actual">− ${escHtml(d.actual)}</span>
          </div>
        </td>
        <td class="mono">${formatDate(d.detected_at)}</td>
      </tr>
    `).join('');
  }

  function renderEmpty(msg) {
    document.getElementById('drift-table-body').innerHTML =
      `<tr><td colspan="6"><div class="empty-state"><h3>${msg}</h3></div></td></tr>`;
  }

  function setStatus(msg) {
    document.getElementById('status-bar').textContent = msg;
  }

  function escHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString();
  }

  // ── Events ──────────────────────────────────────────────────────────────────

  document.getElementById('btn-scan').addEventListener('click', async () => {
    const btn = document.getElementById('btn-scan');
    btn.disabled = true;
    btn.textContent = '⏳ Scanning...';
    setStatus('Triggering scan...');

    try {
      const res = await fetch(`${API_BASE}/api/v1/scan/trigger`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: false }),
      });
      const data = await res.json();
      setStatus(`Scan queued (ID: ${data.scan_id?.slice(0, 8)}). Refreshing in 5s...`);
      setTimeout(fetchDrifts, 5000);
    } catch (err) {
      setStatus(`Scan trigger failed: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = '▶ Run Scan Now';
    }
  });

  document.getElementById('btn-refresh').addEventListener('click', fetchDrifts);
  document.getElementById('filter-type').addEventListener('change', () => renderTable(allDrifts));
  document.getElementById('filter-severity').addEventListener('change', () => renderTable(allDrifts));

  // ── Init ─────────────────────────────────────────────────────────────────────
  fetchDrifts();
  setInterval(fetchDrifts, 60_000);   // auto-refresh every minute
</script>
</body>
</html>
