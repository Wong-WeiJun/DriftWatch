# Prometheus scrape + alert rule config for local DriftWatch.
#
# Phase 2 (deferred): scrape via ALB / Amazon Managed Prometheus in AWS;
# Alertmanager for SNS/Slack/PagerDuty delivery of these rules.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: driftwatch
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
